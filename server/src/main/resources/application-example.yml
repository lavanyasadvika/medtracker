# ═══════════════════════════════════════════════════════════════════
# MedTracker – Application Configuration TEMPLATE
#
# Copy this file to application.yml and fill in real values.
# NEVER commit application.yml – it is in .gitignore.
# ═══════════════════════════════════════════════════════════════════

spring:

  application:
    name: medtracker-backend

  # ── DataSource (PostgreSQL) ────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/medtracker
    username: ${DB_USERNAME}          # set via env var
    password: ${DB_PASSWORD}          # set via env var
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: MedTrackerHikariPool

  # ── JPA / Hibernate ───────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  # ── Flyway ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Mail (SMTP) ───────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            trust: ${SMTP_SSL_TRUST:sandbox.smtp.mailtrap.io}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

  # ── Security ──────────────────────────────────────────────────
  security:
    user:
      name: actuator
      password: ${ACTUATOR_PASSWORD}

# ── Server ──────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

# ── JWT ─────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}             # min 256-bit random string
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}        # 24 h
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}  # 7 days

  # ── CORS ───────────────────────────────────────────────────────
  cors:
    # Comma-separated list of trusted React/Vite dev origins. The client vite.config.js uses port 3000.
    allowed-origins: ${REACT_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # ── Groq AI ─────────────────────────────────────────────────
  groq:
    api-key: ${GROQ_API_KEY}          # obtain from console.groq.com
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
    mock-enabled: ${GROQ_MOCK_ENABLED:false}

  # ── OpenFDA ─────────────────────────────────────────────────
  openfda:
    base-url: ${OPENFDA_BASE_URL:https://api.fda.gov}
    timeout-seconds: ${OPENFDA_TIMEOUT_SECONDS:10}

  # ── Scheduled alerts ─────────────────────────────────────────
  alerts:
    cron: ${ALERT_CRON:0 0 8 * * *}
    expiry-lead-days: ${ALERT_EXPIRY_LEAD_DAYS:30}
    default-low-stock-threshold: ${ALERT_DEFAULT_LOW_STOCK_THRESHOLD:10}

  # ── Mail sender identity ─────────────────────────────────────
  mail:
    from: ${MAIL_FROM}
    from-name: MedTracker

# ── Actuator / Observability ──────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  server:
    port: 8080
  metrics:
    tags:
      application: medtracker-backend
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      # Points at the Zipkin container's host-published port; override if Zipkin lives elsewhere
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── Logging ─────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.medtracker: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
