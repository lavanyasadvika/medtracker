# ═══════════════════════════════════════════════════════════════════
# MedTracker – Application Configuration (DOCKER)
#
# Active when SPRING_PROFILES_ACTIVE=docker (set by the backend's
# Dockerfile / docker-compose.yml). Every value is env-var driven so
# the same image works for `docker compose up` out of the box (safe
# defaults below) and can be overridden via the root .env file.
#
# This file is safe to commit — it contains no secrets, only
# placeholders and non-sensitive defaults.
# ═══════════════════════════════════════════════════════════════════

spring:

  application:
    name: medtracker-backend

  # ── DataSource (PostgreSQL) ────────────────────────────────────
  # Host defaults to "db", the postgres service name in docker-compose.yml
  datasource:
    # DB_PARAMS lets a deploy target append query params (e.g. Azure Postgres
    # Flexible Server requires "?sslmode=require") without touching the
    # plain-postgres default used by local/docker-compose.
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:medtracker}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: MedTrackerHikariPool

  # ── JPA / Hibernate ───────────────────────────────────────────
  jpa:
    hibernate:
      # DO NOT change – Flyway owns the schema; Hibernate only validates
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  # ── Flyway ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Mail (SMTP) ───────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            trust: ${SMTP_SSL_TRUST:sandbox.smtp.mailtrap.io}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Security (basic defaults; full config in SecurityConfig) ──
  security:
    user:
      name: actuator
      password: ${ACTUATOR_PASSWORD:actuator-dev}

# ── Server ──────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

# ── JWT ─────────────────────────────────────────────────────────
app:
  jwt:
    # Dev-safe default (64-char hex, >=256 bit) — override via JWT_SECRET for anything beyond local/demo use
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000}

  # ── CORS ───────────────────────────────────────────────────────
  cors:
    allowed-origins: ${REACT_ALLOWED_ORIGINS:http://localhost:3000}

  # ── Groq AI ─────────────────────────────────────────────────
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:qwen/qwen3.6-27b}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
    # Defaults to mocked so a fresh checkout with no GROQ_API_KEY still runs the scan flow end-to-end
    mock-enabled: ${GROQ_MOCK_ENABLED:true}

  # ── OpenFDA ─────────────────────────────────────────────────
  openfda:
    base-url: ${OPENFDA_BASE_URL:https://api.fda.gov}
    timeout-seconds: ${OPENFDA_TIMEOUT_SECONDS:10}

  # ── Scheduled alerts ─────────────────────────────────────────
  alerts:
    cron: ${ALERT_CRON:0 0 8 * * *}
    expiry-lead-days: ${ALERT_EXPIRY_LEAD_DAYS:30}
    default-low-stock-threshold: ${ALERT_DEFAULT_LOW_STOCK_THRESHOLD:10}

  # ── Mail sender identity ─────────────────────────────────────
  mail:
    from: ${MAIL_FROM:noreply@medtracker.local}
    from-name: MedTracker

# ── Actuator / Observability ──────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  server:
    port: 8080
  metrics:
    tags:
      application: medtracker-backend
  tracing:
    sampling:
      # 100% for local/demo visibility — dial down for a real production volume
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# ── Logging ─────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.medtracker: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
